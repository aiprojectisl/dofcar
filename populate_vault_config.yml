name: Populate Vault Config

on:
  workflow_dispatch:
    inputs:
      GDRIVE_CLIENT_ID:
        description: 'Google Drive OAuth2 Client ID'
        required: true
        type: string
      GDRIVE_CLIENT_SECRET:
        description: 'Google Drive OAuth2 Client Secret'
        required: true
        type: string
      GDRIVE_REFRESH_TOKEN:
        description: 'Google Drive OAuth2 Refresh Token'
        required: true
        type: string
      GDRIVE_ROOT_FOLDER_ID:
        description: 'Google Drive Root Folder ID'
        required: true
        type: string
      GEMINI_KEY_EMBED:
        description: 'Gemini API Key — Akun 1 (embedding)'
        required: true
        type: string
      GEMINI_KEY_CHAT:
        description: 'Gemini API Key — Akun 2 (synthesis)'
        required: true
        type: string
      RESEND_API_KEY:
        description: 'Resend API Key (admin notify)'
        required: true
        type: string

jobs:
  populate:
    name: Encrypt & Store Credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dofvault
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DOFVAULT_REPO }}
          token: ${{ secrets.PAT_VAULT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run populate script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GDRIVE_CLIENT_ID:      ${{ inputs.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET:  ${{ inputs.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN:  ${{ inputs.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_ROOT_FOLDER_ID: ${{ inputs.GDRIVE_ROOT_FOLDER_ID }}
          GEMINI_KEY_EMBED:      ${{ inputs.GEMINI_KEY_EMBED }}
          GEMINI_KEY_CHAT:       ${{ inputs.GEMINI_KEY_CHAT }}
          RESEND_API_KEY:        ${{ inputs.RESEND_API_KEY }}
        run: node tools/populate_vault_config.js