name: Seed Intent Examples

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dofvault
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/dofvault
          token: ${{ secrets.PAT_VAULT }}
          path: vault

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: vault/engine

      - name: Run seed_intent_examples
        run: node tools/seed_intent_examples.js
        working-directory: vault/engine
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MISTRAL_KEY_EMBED:    ${{ secrets.MISTRAL_KEY_EMBED }}