name: Backfill Attachments
on:
  workflow_dispatch:
    inputs:
      uid:
        description: 'User ID'
        required: true
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: engine
      - name: Run backfill
        working-directory: engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CREDS_SECRET: ${{ secrets.CREDS_SECRET }}
        run: node tools/backfill_attachments.js ${{ github.event.inputs.uid }}