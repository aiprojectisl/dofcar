name: Migrate Embeddings

on:
  workflow_dispatch:
    inputs:
      batch_limit:
        description: 'Jumlah surat yang diproses (5 / 10 / 0 = all)'
        required: false
        default: '10'
        type: choice
        options:
          - '5'
          - '10'
          - '25'
          - '50'
          - '0'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dofvault
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/dofvault
          token: ${{ secrets.PAT_VAULT }}
          path: vault

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: vault/engine

      - name: Run migrate_embeddings
        run: node tools/migrate_embeddings.js
        working-directory: vault/engine
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CREDS_SECRET:         ${{ secrets.CREDS_SECRET }}
          BATCH_LIMIT:          ${{ github.event.inputs.batch_limit }}
