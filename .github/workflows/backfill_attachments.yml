name: Backfill Attachments

on:
  workflow_dispatch:
    inputs:
      uid:
        description: 'User ID'
        required: true
        type: string
      batch_size:
        description: 'Batch size (URLs per batch)'
        required: false
        default: '50'
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dofvault
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/dofvault
          token: ${{ secrets.PAT_VAULT }}
          path: vault

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: vault/engine

      - name: Run backfill attachments
        run: node tools/backfill_attachments.js ${{ inputs.uid }} ${{ inputs.batch_size }}
        working-directory: vault/engine
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          CREDS_SECRET:          ${{ secrets.CREDS_SECRET }}