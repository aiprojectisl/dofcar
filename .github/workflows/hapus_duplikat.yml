name: DOFVault_Hapus_Duplikat

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN mode (true = preview only, false = actual delete)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  hapus_duplikat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dofcar (public)
        uses: actions/checkout@v4

      - name: Checkout dofvault (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DOFVAULT_REPO }}
          token: ${{ secrets.PAT_VAULT }}
          path: dofvault

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dofvault/engine/package.json

      - name: Install dependencies
        working-directory: dofvault/engine
        run: npm ci

      - name: Run hapus_duplikat
        working-directory: dofvault/engine
        env:
          DRY_RUN:              ${{ github.event.inputs.dry_run }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CREDS_SECRET:         ${{ secrets.CREDS_SECRET }}
        run: node tools/hapus_duplikat.js