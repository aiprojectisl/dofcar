name: Rename Storage

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (true = preview, false = execute)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dofvault
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/dofvault
          token: ${{ secrets.PAT_VAULT }}
          path: vault

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: vault/engine

      - name: Run rename_storage
        run: node tools/rename_storage.js
        working-directory: vault/engine
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_STORAGE_URL:  ${{ secrets.SUPABASE_STORAGE_URL }}
          SUPABASE_STORAGE_KEY:  ${{ secrets.SUPABASE_STORAGE_KEY }}
          DRY_RUN:               ${{ inputs.dry_run }}
