name: Generate Repomix Output

on:  
  workflow_dispatch:  # Memungkinkan running manual

jobs:
  repomix:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ambil seluruh history untuk konteks lengkap
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run Repomix
        run: npx repomix
      
      - name: Upload Repomix output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: repomix-output
          path: repomix-output.txt
          retention-days: 7
      
      - name: (Opsional) Commit output ke branch terpisah
        run: |
          # Hanya jika ingin menyimpan output di repo
          mkdir -p .repomix
          cp repomix-output.txt .repomix/repomix-output-$(date +%Y%m%d-%H%M%S).txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .repomix/ || true
          git diff --staged --quiet || git commit -m "Update Repomix output [skip ci]"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}