name: Populate Vault Config

on:
  workflow_dispatch:

concurrency:
  group: dof-vault
  cancel-in-progress: false

jobs:
  vault:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout dofvault (private)
        uses: actions/checkout@v4
        with:
          repository: aiprojectisl/dofvault
          token: ${{ secrets.PAT_VAULT }}
          path: vault

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: vault/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=dev --prefer-offline
        working-directory: vault

      - name: Run populate script
        working-directory: vault
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          CREDS_SECRET:           ${{ secrets.CREDS_SECRET }}
          SUPABASE_STORAGE_URL:   ${{ secrets.SUPABASE_STORAGE_URL }}
          SUPABASE_STORAGE_KEY:   ${{ secrets.SUPABASE_STORAGE_KEY }}
          GEMINI_KEY_EMBED:       ${{ secrets.GEMINI_KEY_EMBED }}
          GEMINI_KEY_CHAT:        ${{ secrets.GEMINI_KEY_CHAT }}
          RESEND_API_KEY:         ${{ secrets.RESEND_API_KEY }}
          PAT_VAULT:              ${{ secrets.PAT_VAULT }}
          SUPABASE_KEY:           ${{ secrets.SUPABASE_KEY }}

        run: node tools/populate_vault_config.js